<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabbit Hole Files</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>The Rabbit Hole</h1>
        <p>Documenting random descents into the unknown.</p>
        <div class="file-controls">
          <button id="export-btn" class="util-btn">Export Alice</button>
          <input type="file" id="import-input" style="display: none" />
          <button id="import-btn" class="util-btn">Import Alice</button>
        </div>
      </header>

      <section class="entry-form">
        <input
          type="text"
          id="topic"
          placeholder="Topic (e.g., Dyson Sphere Fascinations)"
        />
        <!--tags entry-->
        <input
          type="text"
          id="tags"
          placeholder="Tags (comma separated: e.g. physics, stars, artificial intelligence)"
        />
        <textarea id="notes" placeholder="What did you find out?"></textarea>
        <div class="button-group">
          <button id="save-btn">Log Entry</button>
          <!-- Clear All button -->
          <button id="clear-all-btn" class="secondary-btn">Clear All</button>
        </div>
      </section>

      <section class="filter-section">
        <input
          type="text"
          id="tag-filter"
          placeholder="Filter by tag (e.g, physics, stars, artificial intelligence)..."
        />
      </section>

      <section id="journal-output" class="journal-list">
        <!--entries will appear here-->
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
