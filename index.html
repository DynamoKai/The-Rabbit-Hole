<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2nd Nature Studios</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ROOM 1: The Landing Page -->
    <canvas id="star-matrix"></canvas>
    <main id="landing-page">
      <section class="apothecary-cabinet" id="main-cabinet">
        <!-- Drawer 1: About -->
        <div
          class="cabinet-drawer"
          data-action="terminal"
          data-original-text="> about.exe"
        >
          <div class="brass-pull">
            <span class="terminal-label">> about.exe</span>
          </div>
        </div>

        <!-- Drawer 2: Skills -->
        <div
          class="cabinet-drawer"
          data-action="terminal"
          data-original-text="> capabilities.sys"
        >
          <div class="brass-pull">
            <span class="terminal-label">> capabilities.sys</span>
          </div>
        </div>

        <!-- Drawer 3: Projects -->
        <div
          class="cabinet-drawer"
          data-action="terminal"
          data-original-text="> projects.dir"
        >
          <div class="brass-pull">
            <span class="terminal-label">> project.dir</span>
          </div>
        </div>

        <!-- Drawer 4: TRH -->
        <div
          class="cabinet-drawer"
          data-action="enter-hole"
          data-original-text="> the-rabbit-hole.exe"
        >
          <div class="brass-pull">
            <span class="terminal-label">> the-rabbit-hole.exe</span>
          </div>
        </div>

        <!-- Drawer 5: Contact & Resume -->
        <div
          class="cabinet-drawer"
          data-action="terminal"
          data-original-text="> contact.bat"
        >
          <div class="brass-pull">
            <span class="terminal-label">> contact.bat</span>
          </div>
        </div>
      </section>

      <section id="terminal-display" class="hidden">
        <div class="terminal-header">
          <span id="terminal-title">_</span>
          <button id="close-terminal" class="util-btn">✕ Close</button>
        </div>
        <div class="terminal-body" id="terminal-content"></div>
      </section>
    </main>

    <!-- ROOM 2: TRH -->
    <div id="rabbit-hole-app" class="hidden">
      <div class="container">
        <header>
          <h1>The Rabbit Hole</h1>
          <p>Documenting random descents into the unknown.</p>
          <div class="file-controls">
            <button id="export-btn" class="util-btn">Export Alice</button>
            <input type="file" id="import-input" style="display: none" />
            <button id="import-btn" class="util-btn">Import Alice</button>
            <button id="sort-btn" class="util-btn">Sort: Newest First</button>
            <button
              id="exit-hole-btn"
              class="util-bin"
              style="margin-left: 1rem"
            >
              << Return to Nature
            </button>
          </div>
        </header>

        <hr class="dotted-line" />
        <div id="top-tags-container" class="top-tags-wrapper"></div>

        <div id="topic-slot"></div>

        <section class="entry-form">
          <input
            type="text"
            id="topic"
            placeholder="Topic (e.g., Dyson Sphere Fascinations)"
          />
          <!-- --------------------------- tags entry --------------------------------------- -->
          <!----------------------------- tags entry ----------------------------------------->
          <input
            type="text"
            id="tags"
            placeholder="Tags (comma separated: e.g. physics, stars, artificial intelligence)"
          />

          <div class="depth-selector">
            <label for="depth">DEPTH LEVEL</label>
            <input
              type="range"
              id="depth"
              min="1"
              max="5"
              value="1"
              oninput="
                document.getElementById('depth-display').innerText = this.value
              "
            />
            <span
              id="depth-display"
              style="color: var(--accent); font-weight: bold"
              >1</span
            >
          </div>
          <textarea id="notes" placeholder="What did you find out?"></textarea>

          <!-- -------------------------- anecdote section ------------------------------------>
          <!---------------------------- anecdote section ---------------------------------- -->
          <div id="anecdote-sidebar" class="sidebar">
            <div class="crt-image-container">
              <img
                src="Images/Whiterabbit.watch-copy.webp"
                alt="White Rabbit"
                class="crt-image"
              />
            </div>
            <div class="sidebar-header">
              <h2 id="sidebar-title">Anecdote</h2>
              <button onclick="closeSidebar()" class="close-btn">✕</button>
            </div>
            <div class="sidebar-body">
              <textarea
                id="sidebar-content"
                placeholder="Why is a raven like a writing-desk?"
              ></textarea>
              <button id="save-anecdote-btn" class="util-btn">
                Save Changes
              </button>
            </div>
          </div>
          <div id="sidebar-overlay" onclick="closeSidebar()"></div>

          <div class="button-group">
            <button id="save-btn">Log Entry</button>
            <!-------------------------- Clear All button ------------------------------------>
            <!-------------------------- Clear All button ------------------------------------>
            <button id="clear-all-btn" class="secondary-btn">Clear All</button>
          </div>
        </section>

        <!---------------------------- Search section ------------------------------------>
        <!---------------------------- Search section ------------------------------------>
        <div class="search-console">
          <span class="prompt-symbol">Search me</span>
          <input
            type="text"
            id="curiositySearch"
            placeholder="Why is a raven like a writing desk?"
            autocomplete="off"
          />
        </div>
        <!-------------------------------------------------------------------------------->

        <section class="filter-section">
          <input
            type="text"
            id="tag-filter"
            placeholder="Filter by tag (e.g, physics, stars, artificial intelligence)..."
          />
        </section>

        <section id="journal-output" class="journal-list">
          <!--------------------------entries will appear here------------------------------->
          <!--------------------------entries will appear here------------------------------->
        </section>
      </div>
      <!-- The Ambient Drawer Cue -->
      <audio
        id="drawer-sound"
        src="Audio/synth-swell.mp3"
        preload="auto"
      ></audio>
      <script src="script.js"></script>
    </div>
  </body>
</html>
