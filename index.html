<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabbit Hole Files</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>The Rabbit Hole</h1>
        <p>Documenting random descents into the unknown.</p>
        <div class="file-controls">
          <button id="export-btn" class="util-btn">Export Alice</button>
          <input type="file" id="import-input" style="display: none" />
          <button id="import-btn" class="util-btn">Import Alice</button>
          <button id="sort-btn" class="util-btn">Sort: Newest First</button>
        </div>
      </header>

      <section class="entry-form">
        <input
          type="text"
          id="topic"
          placeholder="Topic (e.g., Dyson Sphere Fascinations)"
        />
        <!----------------------------- tags entry ----------------------------------------->
        <!----------------------------- tags entry ----------------------------------------->
        <input
          type="text"
          id="tags"
          placeholder="Tags (comma separated: e.g. physics, stars, artificial intelligence)"
        />

        <div class="depth-selector">
          <label for="depth">DEPTH LEVEL</label>
          <input
            type="range"
            id="depth"
            min="1"
            max="5"
            value="1"
            oninput="
              document.getElementById('depth-display').innerText = this.value
            "
          />
          <span
            id="depth-display"
            style="color: var(--accent); font-weight: bold"
            >1</span
          >
        </div>
        <textarea id="notes" placeholder="What did you find out?"></textarea>

        <!---------------------------- anecdote section ------------------------------------>
        <div id="anecdote-sidebar" class="sidebar">
          <div class="sidebar-header">
            <h2 id="sidebar-title">Anecdote</h2>
            <button onclick="closeSidebar()" class="close-btn">✕</button>
          </div>
          <div class="sidebar-body">
            <textarea
              id="sidebar-content"
              placeholder="Why is a raven like a writing-desk?"
            ></textarea>
            <button id="save-anecdote-btn" class="util-btn">
              Save Changes
            </button>
          </div>
        </div>
        <div id="sidebar-overlay" onclick="closeSidebar()"></div>

        <div class="button-group">
          <button id="save-btn">Log Entry</button>
          <!-------------------------- Clear All button ------------------------------------>
          <!-------------------------- Clear All button ------------------------------------>
          <button id="clear-all-btn" class="secondary-btn">Clear All</button>
        </div>
      </section>

      <section class="filter-section">
        <input
          type="text"
          id="tag-filter"
          placeholder="Filter by tag (e.g, physics, stars, artificial intelligence)..."
        />
      </section>

      <section id="journal-output" class="journal-list">
        <!--------------------------entries will appear here------------------------------->
        <!--------------------------entries will appear here------------------------------->
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
